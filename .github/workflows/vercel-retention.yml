name: Keep three Vercel deployments
on:
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vercel-deployment-retention
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.creator.login == 'vercel[bot]' &&
      contains(fromJSON('["success", "failure", "error"]'), github.event.deployment_status.state))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Keep live production and two prior successful versions
        env:
          VERCEL_RETENTION_TOKEN: ${{ secrets.VERCEL_RETENTION_TOKEN }}
        run: python3 .github/scripts/vercel_retention.py
