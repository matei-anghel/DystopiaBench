[project]
name = "dystopiabench"
version = "2.0.0a0"
description = "DystopiaBench: does a model build the harmful component when asked inside a realistic project?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dystopiabench = "dystopiabench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dystopiabench"]

[tool.hatch.build.targets.sdist]
include = ["dystopiabench", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
